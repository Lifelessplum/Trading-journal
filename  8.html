<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trade Journal">
<title>Trade Journal</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080b12; --bg2: #0a0d15; --bg3: #0f1117;
    --border: #1e293b; --border2: #334155;
    --text: #e2e8f0; --muted: #475569; --faint: #64748b;
    --green: #22c55e; --red: #ef4444; --blue: #38bdf8;
    --pink: #f472b6; --indigo: #6366f1;
    --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }

  .header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 8px; }
  .header-title { font-family: var(--mono); font-weight: 700; font-size: 17px; }
  .header-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; align-items: center; }
  .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .stats-bar { background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .stats-bar::-webkit-scrollbar { display: none; }
  .stat { padding: 10px 16px; border-right: 1px solid var(--border); min-width: 85px; flex-shrink: 0; }
  .stat-label { font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
  .stat-value { font-family: var(--mono); font-weight: 700; font-size: 15px; margin-top: 2px; }

  .tabs { display: flex; gap: 6px; padding: 14px 16px 0; }
  .tab { font-family: var(--mono); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 7px 16px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted); transition: all 0.15s; }
  .tab.active { background: var(--indigo); border-color: var(--indigo); color: #fff; }

  .content { padding: 14px 16px; max-width: 700px; margin: 0 auto; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .search-input { background: var(--bg3); border: 1px solid var(--border2); border-radius: 6px; padding: 8px 12px; color: var(--text); font-size: 13px; font-family: var(--mono); outline: none; width: 140px; }

  .trade-card { background: var(--bg3); border-radius: 10px; padding: 16px; margin-bottom: 10px; border-left: 3px solid var(--border2); border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .card-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ticker { font-family: var(--mono); font-size: 20px; font-weight: 700; }
  .card-pnl { font-family: var(--mono); font-size: 18px; font-weight: 700; text-align: right; }
  .card-date { font-family: var(--mono); font-size: 10px; color: var(--faint); text-align: right; margin-top: 2px; }
  .card-details { display: flex; gap: 16px; margin-top: 10px; font-family: var(--mono); font-size: 12px; color: #94a3b8; flex-wrap: wrap; }
  .card-details span span { color: #cbd5e1; }
  .card-metrics { display: flex; gap: 12px; margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); flex-wrap: wrap; background: #0a0d15; border-radius: 6px; padding: 8px 10px; }
  .card-metrics span span { color: #94a3b8; }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .card-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .card-link { font-family: var(--mono); font-size: 11px; color: var(--blue); text-decoration: none; background: #38bdf811; border: 1px solid #38bdf822; border-radius: 4px; padding: 3px 10px; }
  .card-notes { margin-top: 8px; font-size: 12px; color: var(--faint); line-height: 1.6; font-style: italic; }
  .card-actions { display: flex; gap: 8px; margin-top: 12px; }

  .badge { font-family: var(--mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 4px; }

  .form-box { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .form-title { font-family: var(--mono); color: var(--indigo); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px; }
  .form-section { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 12px 0 6px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
  .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 4px; }
  .form-full { margin-bottom: 4px; }
  .form-input { background: #1e293b; border: 1px solid var(--border2); border-radius: 6px; padding: 9px 12px; color: var(--text); font-size: 13px; font-family: var(--mono); outline: none; width: 100%; -webkit-appearance: none; }
  .form-input::placeholder { color: var(--muted); }
  select.form-input { cursor: pointer; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tag-btn { font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 5px 10px; border-radius: 5px; cursor: pointer; border: 1px solid var(--border2); background: #1e293b; color: var(--muted); }
  .tag-btn.selected { background: #6366f144; border-color: var(--indigo); color: var(--indigo); }
  textarea.form-input { resize: vertical; line-height: 1.6; min-height: 70px; }
  .form-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  .btn { font-family: var(--mono); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 14px; border-radius: 6px; cursor: pointer; border: 1px solid; transition: opacity 0.15s; white-space: nowrap; }
  .btn:active { opacity: 0.7; }
  .btn-indigo { background: #6366f122; color: var(--indigo); border-color: #6366f144; }
  .btn-green  { background: #22c55e22; color: var(--green);  border-color: #22c55e44; }
  .btn-red    { background: #ef444422; color: var(--red);    border-color: #ef444444; }
  .btn-gray   { background: #47556922; color: var(--muted);  border-color: #47556944; }
  .btn-blue   { background: #38bdf822; color: var(--blue);   border-color: #38bdf844; }

  .filter-btn { font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 12px; border-radius: 5px; cursor: pointer; border: 1px solid var(--border2); background: transparent; color: var(--muted); }
  .filter-btn.active { background: #6366f133; border-color: var(--indigo); color: var(--indigo); }

  .stats-row { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .stats-ticker { font-family: var(--mono); font-weight: 700; font-size: 17px; }
  .stats-right { display: flex; gap: 16px; align-items: center; }
  .stats-count { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .stats-pnl { font-family: var(--mono); font-weight: 700; font-size: 16px; }
  .section-label { font-family: var(--mono); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; margin-top: 24px; border-bottom: 1px dashed var(--border); padding-bottom: 4px; }

  .empty { text-align: center; color: var(--border2); padding: 30px 0; font-family: var(--mono); font-size: 13px; }
  .loading { min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: var(--mono); color: var(--muted); font-size: 13px; flex-direction: column; gap: 10px; }
  .spinner { width: 22px; height: 22px; border: 2px solid var(--border2); border-top-color: var(--indigo); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #import-csv { display: none; }

  @media (max-width: 400px) {
    .form-grid-3 { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div id="app"><div class="loading"><div class="spinner"></div><span>Opening Storage Engine…</span></div></div>
<input type="file" id="import-csv" accept=".csv" onchange="handleImport(event)">

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const TAGS = ['swing','day trade','options','earnings','breakout','reversal','scalp'];

// ── State ───────────────────────────────────────────────────────────────────
let trades = [];
let livePrices = {}; // Store fetched real-time quotes dynamically { AAPL: 175.20 }
let showForm = false;
let editingTrade = null;
let filter = 'all';
let search = '';
let tab = 'journal';
let formData = emptyForm();

function emptyForm() {
  return {
    ticker:'', status:'open', direction:'long', entry:'', exit:'', shares:'',
    tags:[], notes:'', date: today(),
    chartDaily:'', chartWeekly:'', chartDailyPost:'',
    adrr:'', adr:'', rvol:'', adrMult21:'', adrMult50:'', initialRisk:'', initialStop:''
  };
}
function today() { return new Date().toISOString().slice(0,10); }

// ── Local Storage Engine ────────────────────────────────────────────────────
function getLocalBackup() {
  try {
    const r = localStorage.getItem('tj_backup');
    return r ? JSON.parse(r) : [];
  } catch {
    return [];
  }
}

function saveLocal(tradeList) {
  localStorage.setItem('tj_backup', JSON.stringify(tradeList));
}

// ── Live Quotes — Finnhub ────────────────────────────────────────────────────
const FINNHUB_KEY = 'd8dmvh9r01qhm4ag26rgd8dmvh9r01qhm4ag26s0';

async function fetchLivePrices() {
  const openTickers = [...new Set(trades.filter(t => t.status === 'open').map(t => t.ticker.toUpperCase()))];
  if (!openTickers.length) return;

  await Promise.all(openTickers.map(async ticker => {
    try {
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${FINNHUB_KEY}`);
      const data = await res.json();
      if (data?.c && data.c > 0) {
        livePrices[ticker] = parseFloat(data.c);
      }
    } catch (e) {
      console.warn(`Finnhub fetch failed for ${ticker}:`, e);
    }
  }));
  render();
}

// Automatically fetch live prices every 30 seconds
setInterval(fetchLivePrices, 30000);

// ── Helpers ─────────────────────────────────────────────────────────────────
function pnl(t) {
  let targetPrice = parseFloat(t.exit);
  if (t.status === 'open') {
    const live = livePrices[t.ticker.toUpperCase()];
    if (!live) return 0; // Don't guess if price hasn't fetched yet
    targetPrice = live;
  }
  const raw = (targetPrice - parseFloat(t.entry)) * parseInt(t.shares);
  return t.direction === 'short' ? -raw : raw;
}

function movePercent(t) {
  let targetPrice = parseFloat(t.exit);
  if (t.status === 'open') {
    const live = livePrices[t.ticker.toUpperCase()];
    if (!live) return 0;
    targetPrice = live;
  }
  const entry = parseFloat(t.entry);
  if (!entry) return 0;
  
  const rawPct = ((targetPrice - entry) / entry) * 100;
  return t.direction === 'short' ? -rawPct : rawPct;
}

function fmt(n) { return (n >= 0 ? '+' : '') + Number(n).toFixed(2); }

function result(t) { 
  const p = pnl(t); 
  return p > 0 ? 'win' : p < 0 ? 'loss' : 'breakeven'; 
}

function nextId() { return Math.max(0, ...trades.map(t => t.id), 0) + 1; }

function colorFor(key) {
  return { win:'#22c55e', loss:'#ef4444', breakeven:'#94a3b8', long:'#38bdf8', short:'#f472b6', tag:'#6366f1', open:'#indigo' }[key] || '#94a3b8';
}

function badge(label, colorKey) {
  const c = colorFor(colorKey);
  return `<span class="badge" style="background:${c}22;color:${c};border:1px solid ${c}44">${label}</span>`;
}

// ── CSV Core Generator ──────────────────────────────────────────────────────
function generateCSVText() {
  const headers = [
    'Date','Ticker','Status','Direction','Entry','Exit','Shares','P&L','Result',
    'ADRR','ADR','RVOL','ADR Mult 21D','ADR Mult 50D',
    'Chart Daily-Pre','Chart Weekly-Pre','Chart Daily-Post',
    'Tags','Notes'
  ];
  const rows = trades.map(t => [
    t.date, t.ticker, t.status || 'closed', t.direction, t.entry, t.status === 'open' ? '' : t.exit, t.shares,
    pnl(t).toFixed(2), result(t),
    t.adrr||'', t.adr||'', t.rvol||'', t.adrMult21||'', t.adrMult50||'',
    t.chartDaily||'', t.chartWeekly||'', t.chartDailyPost||'',
    (t.tags||[]).join(';'), (t.notes||'').replace(/"/g,"'")
  ]);
  return [headers, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
}

// ── Export CSV ──────────────────────────────────────────────────────────────
function exportCSV() {
  if (!trades.length) { alert('No trades to export.'); return; }
  const csv = generateCSVText();
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `trade-journal-${today()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

// ── Share Routine ───────────────────────────────────────────────────────────
async function shareCSV() {
  if (!trades.length) { alert('No trades to email/share.'); return; }
  const csvText = generateCSVText();
  const filename = `trade-journal-${today()}.csv`;
  const blob = new Blob([csvText], { type: 'text/csv' });
  const file = new File([blob], filename, { type: 'text/csv' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'Trade Journal Backup', text: 'Attached is my manual trade journal data export.' });
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }
  exportCSV();
  const subject = encodeURIComponent(`Trade Journal Data Backup - ${today()}`);
  const body = encodeURIComponent(`Hi,\n\nYour trade history has been downloaded to your machine automatically.\n\nPlease ATTACH the file named "${filename}" from your downloads folder to this email to transfer it.\n\nBest,\nJournal Bot`);
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
}

// ── Smart Import Routine ────────────────────────────────────────────────────
function triggerImport() { document.getElementById('import-csv').click(); }

function handleImport(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const lines = ev.target.result.split('\n').filter(l => l.trim());
      const headers = lines[0].split(',').map(h => h.replace(/"/g,'').trim());
      const imported = lines.slice(1).map((line, i) => {
        const vals = line.match(/(".*?"|[^,]+)/g) || [];
        const clean = vals.map(v => v.replace(/^"|"$/g,'').trim());
        const get = col => clean[headers.indexOf(col)] || '';
        const stat = get('Status').toLowerCase();
        return {
          id: i + 1,
          date: get('Date'), ticker: get('Ticker'), 
          status: stat === 'open' ? 'open' : 'closed',
          direction: get('Direction'),
          entry: parseFloat(get('Entry'))||0, exit: parseFloat(get('Exit'))||0,
          shares: parseInt(get('Shares'))||0,
          adrr: get('ADRR'), adr: get('ADR'), rvol: get('RVOL'),
          adrMult21: get('ADR Mult 21D'), adrMult50: get('ADR Mult 50D'),
          chartDaily: get('Chart Daily-Pre'), chartWeekly: get('Chart Weekly-Pre'),
          chartDailyPost: get('Chart Daily-Post'),
          tags: get('Tags') ? get('Tags').split(';').filter(Boolean) : [],
          notes: get('Notes')
        };
      }).filter(t => t.ticker);

      if (!imported.length) { alert('No valid trades found in CSV.'); return; }
      const choice = confirm(`Found ${imported.length} trades in file.\n\nClick OK to OVERWRITE.\n\nClick Cancel to SMART MERGE.`);
      
      if (choice) {
        trades = imported.map((t, index) => ({ ...t, id: index + 1 }));
      } else {
        let addedCount = 0;
        imported.forEach(imp => {
          const isDuplicate = trades.some(t => t.date === imp.date && t.ticker.toUpperCase() === imp.ticker.toUpperCase() && parseFloat(t.entry) === parseFloat(imp.entry) && parseInt(t.shares) === parseInt(imp.shares));
          if (!isDuplicate) { imp.id = nextId() + addedCount; trades.push(imp); addedCount++; }
        });
      }
      saveLocal(trades); fetchLivePrices(); render();
    } catch { alert('Import failed.'); }
    e.target.value = '';
  };
  reader.readAsText(file);
}

// ── Render Card Helper ──────────────────────────────────────────────────────
function buildCardHtml(t) {
  const p = pnl(t), res = result(t);
  const bc = p > 0 ? '#22c55e' : p < 0 ? '#ef4444' : '#94a3b8';
  const move = movePercent(t).toFixed(2);
  
  const livePrice = livePrices[t.ticker.toUpperCase()];
  const exitDisplay = t.status === 'open' 
    ? (livePrice ? `Live: $${livePrice.toFixed(2)}` : '[ Fetching Live... ]') 
    : `Exit: $${t.exit}`;

  const metrics = [
    t.adrr      ? `ADRR <span>${t.adrr}</span>`         : '',
    t.adr       ? `ADR <span>${t.adr}</span>`           : '',
    t.rvol      ? `RVOL <span>${t.rvol}</span>`         : '',
    t.adrMult21 ? `ADR×21D <span>${t.adrMult21}</span>` : '',
    t.adrMult50 ? `ADR×50D <span>${t.adrMult50}</span>` : '',
  ].filter(Boolean);

  const links = [
    t.chartDaily     ? `<a class="card-link" href="${t.chartDaily}" target="_blank">📈 Daily-Pre</a>`   : '',
    t.chartWeekly    ? `<a class="card-link" href="${t.chartWeekly}" target="_blank">📊 Weekly-Pre</a>` : '',
    t.chartDailyPost ? `<a class="card-link" href="${t.chartDailyPost}" target="_blank">📉 Daily-Post</a>` : '',
  ].filter(Boolean);

  return `
  <div class="trade-card" style="border-left-color:${bc}">
    <div class="card-top">
      <div class="card-left">
        <span class="ticker">${t.ticker}</span>
        ${badge(t.status === 'open' ? 'Open' : 'Closed', t.status === 'open' ? 'long' : 'breakeven')}
        ${badge(t.direction, t.direction)} ${badge(res, res)}
      </div>
      <div>
        <div class="card-pnl" style="color:${bc}">${fmt(p)}</div>
        <div class="card-date">${t.date}</div>
      </div>
    </div>
    <div class="card-details">
      <span>Entry <span>$${t.entry}</span></span>
      <span><span>${exitDisplay}</span></span>
      <span>Shares <span>${t.shares}</span></span>
      <span>Move <span style="color:${bc}">${fmt(move)}%</span></span>
      ${(() => { const ir = parseFloat(t.initialRisk); if (!ir || p === 0) return ''; const r = p / ir; const rc = r >= 0 ? '#22c55e' : '#ef4444'; return '<span>R <span style="color:' + rc + '">' + (r >= 0 ? '+' : '') + r.toFixed(2) + 'R</span></span>'; })()}
    </div>
    ${metrics.length?`<div class="card-metrics">${metrics.map(m=>`<span>${m}</span>`).join('')}</div>`:''}
    ${links.length?`<div class="card-links">${links.join('')}</div>`:''}
    ${(t.tags||[]).length?`<div class="card-tags">${t.tags.map(tg=>badge(tg,'tag')).join('')}</div>`:''}
    ${t.notes?`<div class="card-notes">"${t.notes}"</div>`:''}
    <div class="card-actions">
      <button class="btn btn-indigo" onclick="startEdit(${t.id})">Edit</button>
      <button class="btn btn-red" onclick="deleteTrade(${t.id})">Delete</button>
    </div>
  </div>`;
}

// ── Main Render Engine ──────────────────────────────────────────────────────
function render() {
  const s = (() => {
    const totalPnl = trades.reduce((a,t) => a + pnl(t), 0);
    const wins = trades.filter(t => pnl(t) > 0);
    const losses = trades.filter(t => pnl(t) < 0);
    return {
      totalPnl, wins: wins.length, losses: losses.length,
      winRate: trades.length ? ((wins.length/trades.length)*100).toFixed(0) : 0,
      avgWin: wins.length ? wins.reduce((a,t)=>a+pnl(t),0)/wins.length : 0,
      avgLoss: losses.length ? losses.reduce((a,t)=>a+pnl(t),0)/losses.length : 0
    };
  })();

  const statsBar = [
    { label:'Total P&L', value: fmt(s.totalPnl), color: s.totalPnl>=0?'#22c55e':'#ef4444' },
    { label:'Win Rate',  value: `${s.winRate}%`,  color: '#38bdf8' },
    { label:'Wins',      value: s.wins,            color: '#22c55e' },
    { label:'Losses',    value: s.losses,          color: '#ef4444' },
    { label:'Avg Win',   value: fmt(s.avgWin),     color: '#22c55e' },
    { label:'Avg Loss',  value: fmt(s.avgLoss),    color: '#ef4444' },
  ].map(x=>`<div class="stat"><div class="stat-label">${x.label}</div><div class="stat-value" style="color:${x.color}">${x.value}</div></div>`).join('');

  const filtered = trades.filter(t => {
    if (filter !== 'all' && result(t) !== filter) return false;
    if (search && !t.ticker.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  // Segregate filtered lists into Open and Closed arrays
  const openCards = filtered.filter(t => t.status === 'open').reverse().map(buildCardHtml).join('');
  const closedCards = filtered.filter(t => t.status !== 'open').reverse().map(buildCardHtml).join('');

  const formHtml = showForm ? `
  <div class="form-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="form-title" style="margin-bottom:0">${editingTrade?'\u270f Edit Position':'+ Log Position'}</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-green" onclick="submitForm()">Save Position</button>
        <button class="btn btn-gray" onclick="cancelForm()">Cancel</button>
      </div>
    </div>

    <div class="form-section">Position Configuration</div>
    <div class="form-grid">
      <select class="form-input" onchange="fd('status',this.value); render();">
        <option value="closed" ${formData.status==='closed'?'selected':''}>Closed Position</option>
        <option value="open" ${formData.status==='open'?'selected':''}>Open Position</option>
      </select>
      <select class="form-input" onchange="fd('direction',this.value)">
        <option value="long" ${formData.direction==='long'?'selected':''}>Long</option>
        <option value="short" ${formData.direction==='short'?'selected':''}>Short</option>
      </select>
    </div>

    <div class="form-section">Trade Details</div>
    <div class="form-grid">
      <input class="form-input" placeholder="Ticker (AAPL)" value="${formData.ticker}" oninput="fd('ticker',this.value)">
      <input class="form-input" type="number" placeholder="Entry Price" value="${formData.entry}" oninput="fd('entry',this.value)">
      
      ${formData.status !== 'open' ? `<input class="form-input" id="form-exit-input" type="number" placeholder="Exit Price" value="${formData.exit}" oninput="fd('exit',this.value)">` : ''}
      
      <input class="form-input" type="number" placeholder="Shares / Contracts" value="${formData.shares}" oninput="fd('shares',this.value)">
      <input class="form-input" type="date" value="${formData.date}" oninput="fd('date',this.value)">
    </div>

    <div class="form-section">Risk</div>
    <div class="form-grid">
      <input class="form-input" type="number" placeholder="Initial Risk ($)" value="${formData.initialRisk}" oninput="fd('initialRisk',this.value)">
      <input class="form-input" type="number" placeholder="Initial Stop Price" value="${formData.initialStop}" oninput="fd('initialStop',this.value)">
    </div>

    <div class="form-section">Metrics</div>
    <div class="form-grid-3">
      <input class="form-input" placeholder="ADRR" value="${formData.adrr}" oninput="fd('adrr',this.value)">
      <input class="form-input" placeholder="ADR" value="${formData.adr}" oninput="fd('adr',this.value)">
      <input class="form-input" placeholder="RVOL" value="${formData.rvol}" oninput="fd('rvol',this.value)">
      <input class="form-input" placeholder="ADR Mult 21D" value="${formData.adrMult21}" oninput="fd('adrMult21',this.value)">
      <input class="form-input" placeholder="ADR Mult 50D" value="${formData.adrMult50}" oninput="fd('adrMult50',this.value)">
    </div>

    <div class="form-section">TradingView Charts</div>
    <div class="form-full">
      <input class="form-input" style="margin-bottom:8px" placeholder="Daily-Pre URL" value="${formData.chartDaily}" oninput="fd('chartDaily',this.value)">
      <input class="form-input" style="margin-bottom:8px" placeholder="Weekly-Pre URL" value="${formData.chartWeekly}" oninput="fd('chartWeekly',this.value)">
      <input class="form-input" placeholder="Daily-Post URL" value="${formData.chartDailyPost}" oninput="fd('chartDailyPost',this.value)">
    </div>

    <div class="form-section">Tags</div>
    <div class="tag-row">
      ${TAGS.map(tg=>`<button class="tag-btn ${formData.tags.includes(tg)?'selected':''}" onclick="toggleTag('${tg}')">${tg}</button>`).join('')}
    </div>

    <div class="form-section">Notes</div>
    <textarea class="form-input" placeholder="Notes, setup details, emotions..." oninput="fd('notes',this.value)">${formData.notes}</textarea>


  </div>` : '';

  // Stats Assembly logic
  const byTicker = {};
  trades.forEach(t => {
    if (!byTicker[t.ticker]) byTicker[t.ticker] = { pnl:0, count:0 };
    byTicker[t.ticker].pnl += pnl(t); byTicker[t.ticker].count++;
  });
  const tickerRows = Object.entries(byTicker)
    .sort((a,b)=>Math.abs(b[1].pnl)-Math.abs(a[1].pnl))
    .map(([ticker,d])=>`
    <div class="stats-row">
      <div class="stats-ticker">${ticker}</div>
      <div class="stats-right">
        <span class="stats-count">${d.count} trade${d.count!==1?'s':''}</span>
        <span class="stats-pnl" style="color:${d.pnl>=0?'#22c55e':'#ef4444'}">${fmt(d.pnl)}</span>
      </div>
    </div>`).join('');

  const tagRows = TAGS.map(tag => {
    const tagged = trades.filter(t=>(t.tags||[]).includes(tag));
    if (!tagged.length) return '';
    const tp = tagged.reduce((a,t)=>a+pnl(t),0);
    return `
    <div class="stats-row">
      ${badge(tag,'tag')}
      <div class="stats-right">
        <span class="stats-count">${tagged.length} trade${tagged.length!==1?'s':''}</span>
        <span class="stats-pnl" style="color:${tp>=0?'#22c55e':'#ef4444'}">${fmt(tp)}</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
  <div class="header">
    <div>
      <div class="header-title">📊 Trade Journal</div>
      <div class="header-sub"><span>${trades.length} positions captured locally</span></div>
    </div>
    <div class="header-actions">
      <button class="btn btn-blue" onclick="triggerImport()">↑ Import</button>
      <button class="btn btn-blue" onclick="exportCSV()">↓ Export</button>
      <button class="btn btn-blue" onclick="shareCSV()">✉ Share</button>
      <button class="btn btn-indigo" onclick="toggleForm()">+ Log Position</button>
    </div>
  </div>

  <div class="stats-bar">${statsBar}</div>

  <div class="tabs">
    <button class="tab ${tab==='journal'?'active':''}" onclick="setTab('journal')">Journal</button>
    <button class="tab ${tab==='stats'?'active':''}" onclick="setTab('stats')">Stats</button>
  </div>

  <div class="content">
    ${tab==='journal' ? `
      ${formHtml}
      <div class="filters">
        <input class="search-input" placeholder="Search ticker…" value="${search}" oninput="setSearch(this.value)">
        ${['all','win','loss','breakeven'].map(f=>`<button class="filter-btn ${filter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}
      </div>
      
      <div class="section-label">⚡ Open Positions</div>
      ${openCards || '<div class="empty">No running positions open.</div>'}
      
      <div class="section-label">🔒 Closed Positions</div>
      ${closedCards || '<div class="empty">No completed transactions found.</div>'}
    ` : `
      <div class="section-label">By Ticker</div>
      ${tickerRows||'<div class="empty">No records captured yet.</div>'}
      <div class="section-label">By Tag</div>
      ${tagRows||'<div class="empty">No tagged labels yet.</div>'}
    `}
  </div>`;
}

// ── Actions ─────────────────────────────────────────────────────────────────
function toggleForm() { showForm=!showForm; editingTrade=null; formData=emptyForm(); tab='journal'; render(); }
function cancelForm() { showForm=false; editingTrade=null; formData=emptyForm(); render(); }
function fd(field,value) { formData[field]=value; }

function toggleTag(tag) {
  formData.tags = formData.tags.includes(tag) ? formData.tags.filter(t=>t!==tag) : [...formData.tags,tag];
  render();
}

function submitForm() {
  if (!formData.ticker || !formData.entry || !formData.shares || (formData.status === 'closed' && !formData.exit)) {
    alert('Please fill out Ticker, Entry Price, Shares, and Exit Price (for closed historical positions).'); 
    return;
  }
  const trade = {
    ...formData,
    ticker: formData.ticker.toUpperCase(),
    entry: parseFloat(formData.entry), 
    exit: formData.status === 'open' ? 0 : parseFloat(formData.exit),
    shares: parseInt(formData.shares)
  };
  
  if (editingTrade) {
    trade.id=editingTrade.id;
    trades=trades.map(t=>t.id===trade.id?trade:t);
  } else {
    trade.id=nextId();
    trades=[...trades,trade];
  }
  showForm=false; editingTrade=null; formData=emptyForm();
  saveLocal(trades); fetchLivePrices(); render();
}

function startEdit(id) {
  const t=trades.find(t=>t.id===id); if(!t) return;
  editingTrade=t;
  formData={
    ...t, 
    status: t.status || 'closed',
    entry:String(t.entry), 
    exit:String(t.exit || ''), 
    shares:String(t.shares),
    tags:[...(t.tags||[])],
    chartDaily:t.chartDaily||'', chartWeekly:t.chartWeekly||'', chartDailyPost:t.chartDailyPost||'',
    adrr:t.adrr||'', adr:t.adr||'', rvol:t.rvol||'', adrMult21:t.adrMult21||'', adrMult50:t.adrMult50||'', initialRisk:t.initialRisk||'', initialStop:t.initialStop||''
  };
  showForm=true; tab='journal'; window.scrollTo(0,0); render();
}

function deleteTrade(id) {
  if(!confirm('Delete this position data?')) return;
  trades=trades.filter(t=>t.id!==id);
  saveLocal(trades); render();
}

// ── Controls ────────────────────────────────────────────────────────────────
function setFilter(f) { filter=f; render(); }
function setSearch(v) { search=v; render(); }
function setTab(t) { tab=t; render(); }

// ── Boot Sequence ───────────────────────────────────────────────────────────
(() => { 
  trades = getLocalBackup(); 
  fetchLivePrices(); 
  render(); 
})();
</script>
</body>
</html>
